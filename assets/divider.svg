<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="4" viewBox="0 0 1000 4" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace">
<rect width="1000" height="4" fill="#070a07"/>
<rect width="1000" height="1" fill="#39ff14" opacity="0.35"><animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite"/></rect>
<rect x="0" y="1" width="200" height="2" fill="#39ff14" opacity="0.9"><animate attributeName="x" values="0;1000;0" dur="4s" repeatCount="indefinite"/></rect>
<rect x="0.5" y="0.5" width="999" height="3" fill="none" stroke="#39ff14" stroke-opacity="0.25"/>
</svg>
