<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Abhijeet Dhokne — Engineering Interface</title><desc id="desc">Animated dark terminal banner with neon circuit traces and system diagnostics.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080d0b"/><stop offset=".55" stop-color="#0a100e"/><stop offset="1" stop-color="#0b0912"/></linearGradient>
 <linearGradient id="edge" x2="1"><stop stop-color="#39ff14" stop-opacity=".8"/><stop offset=".55" stop-color="#39ff14" stop-opacity=".12"/><stop offset="1" stop-color="#9a70ff" stop-opacity=".7"/></linearGradient>
 <linearGradient id="name" x2="1"><stop stop-color="#efffed"/><stop offset=".62" stop-color="#b8ffae"/><stop offset="1" stop-color="#a58aff"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1a2b22" stroke-width=".8" opacity=".6"/></pattern>
 <pattern id="scan" width="3" height="5" patternUnits="userSpaceOnUse"><path d="M0 .5H3" stroke="#000" stroke-opacity=".24"/></pattern>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="360" rx="12" fill="url(#bg)"/><rect width="1200" height="360" rx="12" fill="url(#grid)"/>
<ellipse cx="1000" cy="160" rx="230" ry="130" fill="#39ff14" opacity=".035" filter="url(#soft)"/>
<rect x="1" y="1" width="1198" height="358" rx="11" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<path d="M1 42H1199" stroke="#27352c"/><rect x="0" y="0" width="1200" height="42" rx="12" fill="#0d1511"/><path d="M0 30V42H1200V30" fill="#0d1511"/>
<circle cx="24" cy="21" r="5" fill="#39ff14"/><circle cx="44" cy="21" r="5" fill="#9a70ff"/><circle cx="64" cy="21" r="5" fill="#536158"/>
<text x="600" y="25" text-anchor="middle" fill="#728579" font-size="12" letter-spacing="2" font-family="monospace">ABHIJEET@ENGINEERING-NODE : ~/PROFILE</text>
<!-- circuit architecture -->
<g fill="none" stroke="#42564a" stroke-width="1.4" opacity=".72">
 <path d="M760 90H845l22 22h105l20-20h155"/><path d="M800 145h70l24 24h125l20-20h108"/><path d="M755 205h80l22-22h115l24 24h130"/><path d="M835 260h75l22-22h115l22 22h78"/>
 <path d="M1040 70v30m-90 68v34m110 38v32" stroke-dasharray="3 7"/>
</g>
<g fill="none" stroke="#39ff14" stroke-width="2" stroke-dasharray="24 300" filter="url(#glow)">
 <path d="M760 90H845l22 22h105l20-20h155"><animate attributeName="stroke-dashoffset" from="324" to="0" dur="4s" repeatCount="indefinite"/></path>
 <path d="M800 145h70l24 24h125l20-20h108"><animate attributeName="stroke-dashoffset" from="347" to="0" dur="5s" repeatCount="indefinite"/></path>
 <path d="M755 205h80l22-22h115l24 24h130"><animate attributeName="stroke-dashoffset" from="371" to="0" dur="4.6s" repeatCount="indefinite"/></path>
</g>
<g fill="#0b100d" stroke="#39ff14" stroke-width="1.4"><circle cx="760" cy="90" r="4"/><circle cx="1147" cy="92" r="4"/><circle cx="800" cy="145" r="4"/><circle cx="1147" cy="149" r="4"/><circle cx="755" cy="205" r="4"/><circle cx="1126" cy="207" r="4"/></g>
<!-- system output -->
<g font-family="monospace" font-size="13" fill="#9ba99f">
 <text x="42" y="83"><tspan fill="#39ff14">[ OK ]</tspan> initializing runtime environment</text>
 <text x="42" y="106"><tspan fill="#39ff14">[ OK ]</tspan> mounting application services</text>
 <text x="42" y="129"><tspan fill="#39ff14">[ OK ]</tspan> establishing container network</text>
 <text x="42" y="152"><tspan fill="#39ff14">[ OK ]</tspan> loading distributed systems toolkit</text>
 <text x="42" y="175"><tspan fill="#a58aff">[ RUN ]</tspan> exploring applied intelligence</text>
</g>
<text x="39" y="244" fill="url(#name)" font-family="monospace" font-size="53" font-weight="700" letter-spacing="1.5">ABHIJEET DHOKNE</text>
<path d="M42 260H650" stroke="#39ff14" stroke-width="2" opacity=".7"><animate attributeName="stroke-dasharray" values="0 610;610 0;0 610" dur="8s" repeatCount="indefinite"/></path>
<text x="42" y="291" fill="#b6c4ba" font-family="monospace" font-size="15">FULL STACK ENGINEERING  /  BACKEND SYSTEMS  /  DEVOPS  /  APPLIED AI</text>
<text x="42" y="326" fill="#617367" font-family="monospace" font-size="12">$ build --reliable --scalable --continuously</text>
<rect x="42" y="336" width="8" height="13" fill="#39ff14"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<g font-family="monospace" font-size="10" text-anchor="end"><text x="1155" y="298" fill="#66796d">SYS.STATUS</text><text x="1155" y="313" fill="#39ff14">OPERATIONAL</text><text x="1155" y="330" fill="#66796d">ACCESS.LEVEL // DEVELOPER</text></g>
<rect width="1200" height="360" rx="12" fill="url(#scan)" pointer-events="none"/>
<rect x="0" y="42" width="1200" height="2" fill="#39ff14" opacity=".15"><animate attributeName="y" values="42;356;42" dur="7s" repeatCount="indefinite"/></rect>
</svg>
