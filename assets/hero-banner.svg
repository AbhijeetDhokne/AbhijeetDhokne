<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Abhijeet Dhokne - Full-Stack Developer</title>
  <desc id="desc">A dark futuristic terminal interface with neon green and purple grid details.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A3FF6F" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#A3FF6F" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A3FF6F"/>
      <stop offset="1" stop-color="#B78AFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="12" fill="#0D1117"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity=".75"/>
  <path d="M0 70H1200M0 350H1200" stroke="#A3FF6F" stroke-opacity=".10"/>
  <path d="M80 0V420M1120 0V420" stroke="#B78AFF" stroke-opacity=".08"/>

  <g fill="none" stroke="#A3FF6F" stroke-width="2" opacity=".9">
    <path d="M75 92V67H100"/>
    <path d="M1125 328V353H1100"/>
  </g>
  <g fill="#9CA3AF" font-family="JetBrains Mono,Consolas,monospace" font-size="12" letter-spacing="2">
    <text x="86" y="56">SYSTEM / PROFILE</text>
    <text x="1002" y="367">STATUS: ONLINE</text>
  </g>

  <g transform="translate(112 132)">
    <text fill="#A3FF6F" font-family="JetBrains Mono,Consolas,monospace" font-size="16">&gt; whoami</text>
    <text y="72" fill="#FFFFFF" font-family="Inter,Segoe UI,sans-serif" font-size="62" font-weight="800">ABHIJEET DHOKNE</text>
    <rect y="92" width="760" height="2" fill="url(#line)" opacity=".8"/>
    <text y="132" fill="#C9D1D9" font-family="JetBrains Mono,Consolas,monospace" font-size="18" letter-spacing="3">FULL-STACK DEVELOPER</text>
    <text y="166" fill="#9CA3AF" font-family="JetBrains Mono,Consolas,monospace" font-size="15">MERN  /  SPRING BOOT  /  DEVOPS  /  CLOUD</text>
  </g>

  <g transform="translate(920 130)" opacity=".9">
    <rect width="170" height="170" rx="8" fill="#11161D" stroke="#B78AFF" stroke-opacity=".35"/>
    <g fill="#A3FF6F">
      <rect x="25" y="118" width="18" height="32" rx="2"/>
      <rect x="49" y="92" width="18" height="58" rx="2"/>
      <rect x="73" y="105" width="18" height="45" rx="2"/>
      <rect x="97" y="68" width="18" height="82" rx="2"/>
      <rect x="121" y="82" width="18" height="68" rx="2"/>
    </g>
    <g fill="none" stroke="#B78AFF" stroke-width="1.5" stroke-opacity=".65">
      <path d="M25 118L49 92L73 105L97 68L121 82"/>
    </g>
  </g>

  <rect x="75" y="55" width="1050" height="310" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/>
  <path d="M0 0H1200" stroke="#A3FF6F" stroke-opacity=".45">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0 0H1200;M0 420H1200;M0 0H1200"/>
  </path>
  <rect width="1200" height="420" fill="#FFFFFF" opacity=".025">
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
      values=".025;.005;.025"/>
  </rect>
</svg>
