<svg xmlns="http://www.w3.org/2000/svg" width="1552" height="426" viewBox="0 0 1552 426">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff72"/>
      <stop offset=".55" stop-color="#263f35"/>
      <stop offset="1" stop-color="#9b6cff"/>
    </linearGradient>
    <linearGradient id="nameGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4fff5"/>
      <stop offset=".72" stop-color="#d9ffe0"/>
      <stop offset="1" stop-color="#a9ffc0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8affad" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="3" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0H3" stroke="#d4ffe0" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1552" height="426" rx="18" fill="#080d0b"/>
  <rect x="1" y="1" width="1550" height="424" rx="17" fill="url(#grid)"/>
  <rect x="1" y="1" width="1550" height="424" rx="17" fill="url(#scan)"/>
  <rect x="15" y="15" width="1522" height="396" rx="14" fill="none" stroke="url(#edge)" stroke-width="2.2"/>
  <path d="M16 272H1536" stroke="#52ff7a" stroke-opacity=".32" stroke-width="1.2"/>
  <path d="M16 274H1536" stroke="#52ff7a" stroke-opacity=".08" stroke-width="5"/>

  <!-- subtle ambient details -->
  <g fill="#7aff9b" opacity=".23">
    <circle cx="1340" cy="54" r="1.8"/><circle cx="1460" cy="310" r="1.5"/>
    <circle cx="119" cy="386" r="1.3"/><circle cx="1010" cy="20" r="1.2"/>
    <circle cx="748" cy="362" r="1.4"/><circle cx="1510" cy="180" r="1.3"/>
  </g>

  <!-- system log -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing=".3">
    <text x="68" y="70" fill="#5dff83">[ OK ]</text>
    <text x="134" y="70" fill="#9bb4a3"> initializing runtime environment</text>
    <text x="68" y="96" fill="#5dff83">[ OK ]</text>
    <text x="134" y="96" fill="#9bb4a3"> mounting application services</text>
    <text x="68" y="122" fill="#5dff83">[ OK ]</text>
    <text x="134" y="122" fill="#9bb4a3"> establishing system architecture</text>
    <text x="68" y="148" fill="#5dff83">[ OK ]</text>
    <text x="134" y="148" fill="#9bb4a3"> loading development environment</text>
    <text x="68" y="174" fill="#a78bfa">[ RUN ]</text>
    <text x="145" y="174" fill="#a9c4b1"> building ideas into software</text>
  </g>

  <!-- identity -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.4">
    <text x="68" y="278" font-size="58" fill="#64ff8b" opacity=".24" transform="translate(3 0)">ABHIJEET DHOKNE</text>
    <text x="68" y="275" font-size="58" fill="url(#nameGlow)">ABHIJEET DHOKNE</text>
  </g>
  <path d="M70 294H111" stroke="#4dff78" stroke-width="3" filter="url(#tinyGlow)"/>

  <!-- designation -->
  <text x="70" y="337" fill="#c7e8d0" font-family="Consolas, 'Courier New', monospace"
        font-size="19" letter-spacing="1.1">SOFTWARE DEVELOPER</text>
  <path d="M70 354H440" stroke="#4dff78" stroke-opacity=".35" stroke-width="1"/>

  <!-- right-side abstract circuit / system architecture -->
  <g fill="none" stroke="#526e5d" stroke-width="2" stroke-opacity=".56">
    <path d="M980 80H1080L1120 112H1248L1280 82H1468"/>
    <path d="M1030 150H1120L1150 178H1268L1300 150H1468"/>
    <path d="M970 228H1068L1102 194H1230L1264 228H1440"/>
    <path d="M1080 296H1170L1200 270H1320L1350 296H1465"/>
    <path d="M1180 80H1240L1262 96H1338L1360 80H1468" stroke-opacity=".25"/>
  </g>
  <g fill="#08100c" stroke="#57ff80" stroke-width="2">
    <circle cx="980" cy="80" r="5"/><circle cx="1468" cy="82" r="5"/>
    <circle cx="1030" cy="150" r="5"/><circle cx="1468" cy="150" r="5"/>
    <circle cx="970" cy="228" r="5"/><circle cx="1440" cy="228" r="5"/>
  </g>
  <g fill="#45ff78" filter="url(#softGlow)">
    <rect x="1344" y="77" width="30" height="6" rx="3"/>
    <rect x="1238" y="176" width="31" height="6" rx="3"/>
    <rect x="990" y="224" width="32" height="6" rx="3"/>
    <rect x="1380" y="224" width="32" height="6" rx="3"/>
  </g>
  <g fill="#8ca99a" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="end" letter-spacing=".7">
    <text x="1490" y="333">SYS.STATUS</text>
    <text x="1490" y="354" fill="#62ff88">OPERATIONAL</text>
    <text x="1490" y="375">ACCESS.LEVEL / DEVELOPER</text>
  </g>

  <!-- bottom signature -->
  <text x="70" y="390" fill="#60786a" font-family="Consolas, 'Courier New', monospace"
        font-size="13" letter-spacing=".7">$ build --reliable --scalable --continuously</text>
  <rect x="70" y="399" width="10" height="14" rx="1" fill="#4dff78" filter="url(#tinyGlow)"/>
  <path d="M16 410H1536" stroke="#ffffff" stroke-opacity=".035"/>
</svg>